appId: com.yanqu.tenengdao
productName: 特能导
copyright: Copyright © 2026 研趣大学通

# 直接复用 node_modules 中已解压的 Electron，避免打包时联网下载（国内网络易超时）
electronDist: node_modules/electron/dist

directories:
  output: dist
  buildResources: build

files:
  - package.json
  - src/**/*
  - build/icon.ico
  - build/tray.png
  - build/logo-src.png
  - "!**/*.map"
  - "!**/node_modules/**/{test,__tests__,tests,example,examples,doc,docs}/**"

asar: true
asarUnpack:
  - "**/*.node"
compression: maximum
removePackageScripts: true

# 把说明书随安装包一起装到程序目录，用户随时可查
extraFiles:
  - from: docs
    to: docs
    filter: ["**/*.md"]
  - from: README.md
    to: 使用须知-README.md

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: 特能导-${version}-安装包.${ext}
  legalTrademarks: 研趣大学通
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 特能导
  uninstallDisplayName: 特能导
  menuCategory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages:
    - zh_CN
  language: "2052"
  include: build/installer.nsh
  artifactName: 特能导-${version}-安装包.${ext}
